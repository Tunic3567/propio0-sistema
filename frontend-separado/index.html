<!doctype html>
<html lang="en" class="notranslate">
  <head>
    <script>
      (function(){var l=localStorage.getItem('app-locale')||navigator.language||'es';if(l.startsWith('pt'))l='pt';else if(l.startsWith('en'))l='en';else l='es';document.documentElement.lang=l})()
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Evita zoom por pellizco / doble toque en iOS y mantiene escala fija (PWA / web móvil) -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="application-name" content="FinzBPP" />
    <meta name="apple-mobile-web-app-title" content="FinzBPP" />
    <meta name="description" content="FinzBPP — Sistema de gestión de cobranza y administración de rutas para asesores. Controlá pagos, ingresos, egresos y cartera en tiempo real." />
    <meta name="theme-color" content="#1e293b" />
    <!-- Open Graph -->
    <meta property="og:title" content="FinzBPP" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FinzBPP" />
    <meta name="twitter:description" content="FinzBPP — Sistema de gestión de cobranza y administración de rutas para asesores." />
    <meta name="twitter:image" content="/logo.png" />
    <title>FinzBPP</title>

</html>
